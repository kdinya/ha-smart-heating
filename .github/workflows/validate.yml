name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files
        run: python -m json.tool hacs.json >/dev/null && python -m json.tool custom_components/smart_heating/manifest.json >/dev/null && python -m json.tool custom_components/smart_heating/strings.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Compile Python
        run: python -m py_compile custom_components/smart_heating/*.py
      - name: Check card JavaScript
        run: node --check www/smart-heating-card.js
      - name: Check bundled card copy
        run: cmp --silent www/smart-heating-card.js custom_components/smart_heating/www/smart-heating-card.js
      - name: Check required HACS files
        run: test -f hacs.json && test -f README.md && test -f custom_components/smart_heating/brand/icon.png
