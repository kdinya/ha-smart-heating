set_contact:
  name: Set contact switch
  description: Enable or disable contact 1 (heating relay) or contact 2.
  target:
    entity:
      integration: smart_heating
  fields:
    contact_1:
      name: Contact 1
      description: State for contact 1 (main heating relay).
      required: false
      selector:
        boolean:
    contact_2:
      name: Contact 2
      description: State for contact 2.
      required: false
      selector:
        boolean:

set_hysteresis:
  name: Set hysteresis delta
  description: Set turn-on and turn-off hysteresis temperature thresholds.
  target:
    entity:
      integration: smart_heating
  fields:
    hysteresis_on:
      name: Turn-on delta
      description: Temperature drop below target to activate heating.
      required: false
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: "°C"
    hysteresis_off:
      name: Turn-off delta
      description: Temperature rise above target to stop heating.
      required: false
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: "°C"

set_program:
  name: Set heating program
  description: Activate an hourly schedule program or deactivate scheduling.
  target:
    entity:
      integration: smart_heating
  fields:
    program:
      name: Program ID
      description: ID of the program (e.g. P1, P2, or 'none'/'off').
      required: false
      selector:
        text:

set_eco_timer:
  name: Set quick eco timer
  description: Set temporary eco mode duration in minutes (0 to cancel).
  target:
    entity:
      integration: smart_heating
  fields:
    duration:
      name: Duration (minutes)
      description: Duration in minutes.
      required: true
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: "min"

set_relay_timeout:
  name: Set relay verification timeout
  description: Timeout in seconds before generating a relay mismatch warning.
  target:
    entity:
      integration: smart_heating
  fields:
    timeout:
      name: Timeout (seconds)
      description: Seconds to wait for switch state confirmation.
      required: true
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: "s"

set_temp_step:
  name: Set target temperature step
  description: Step size used by the target-temperature +/- buttons.
  target:
    entity:
      integration: smart_heating
  fields:
    step:
      name: Step (°C)
      description: Increment applied by each +/- press.
      required: true
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1
          unit_of_measurement: "°C"

set_eco_temperature:
  name: Set eco temperature
  description: Set target temperature for eco mode and eco schedule hours.
  target:
    entity:
      integration: smart_heating
  fields:
    temperature:
      name: Temperature
      description: Eco target temperature.
      required: true
      selector:
        number:
          min: 5.0
          max: 35.0
          step: 0.1
          unit_of_measurement: "°C"

set_min_target_temperature:
  name: Set minimum target temperature
  description: Set the lower limit for adjusting the target temperature.
  target:
    entity:
      integration: smart_heating
  fields:
    temperature:
      name: Temperature
      description: Minimum allowed target temperature.
      required: true
      selector:
        number:
          min: 5.0
          max: 35.0
          step: 0.5
          unit_of_measurement: "°C"

set_max_target_temperature:
  name: Set maximum target temperature
  description: Set the upper limit for adjusting the target temperature.
  target:
    entity:
      integration: smart_heating
  fields:
    temperature:
      name: Temperature
      description: Maximum allowed target temperature.
      required: true
      selector:
        number:
          min: 5.0
          max: 35.0
          step: 0.5
          unit_of_measurement: "°C"

set_contact_shutdown:
  name: Set contact shutdown action
  description: Sets what action to take for contact 1 or 2 when Home Assistant shuts down.
  fields:
    entity_id:
      name: Smart Heating entity
      description: The climate entity.
      required: true
      selector:
        entity:
          domain: climate
    contact:
      name: Contact number
      description: 1 or 2
      required: true
      example: 1
    action:
      name: Action
      description: turn_off or keep
      required: true
      example: turn_off
